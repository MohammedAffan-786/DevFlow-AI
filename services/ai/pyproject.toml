[project]
name = "devflow-ai-service"
version = "1.0.0"
description = "DevFlow AI AST parsing, token budgeting, and LLM structured inference microservice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.4",
    "tree-sitter>=0.21.3",
    "tree-sitter-languages>=1.10.2",
    "anthropic>=0.21.3",
    "openai>=1.14.3",
    "tiktoken>=0.6.0",
    "loguru>=0.7.2",
    "httpx>=0.27.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
