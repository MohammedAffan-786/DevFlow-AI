name: DevSecOps CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 12.18.0
          runtime: node@20
          cache: true
          require-lockfile: true

      - name: Typecheck Shared Package
        run: pnpm --filter @devflow/shared build

      - name: Lint Workspace
        run: pnpm run lint || true

  security-scan:
    name: DevSecOps Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: TruffleHog Secrets Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  automated-tests:
    name: Automated Verification Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 12.18.0
          runtime: node@20
          cache: true
          require-lockfile: true

      - name: Build Shared Types
        run: pnpm --filter @devflow/shared build

      - name: Execute Automated Test Suites
        run: pnpm --filter @devflow/api test
