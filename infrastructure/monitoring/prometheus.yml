global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'devflow-api'
    metrics_path: '/health/metrics'
    static_configs:
      - targets: ['api:4000']

  - job_name: 'devflow-ai-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ai-service:8000']
